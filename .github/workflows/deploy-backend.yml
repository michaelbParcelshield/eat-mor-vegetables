name: Deploy Backend to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Backend/eat-mor-vegetables-api/eat-mor-vegetables-api.csproj
    
    - name: Build
      run: dotnet build Backend/eat-mor-vegetables-api/eat-mor-vegetables-api.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish Backend/eat-mor-vegetables-api/eat-mor-vegetables-api.csproj --configuration Release --no-build --output ./publish
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'eat-mor-vegetables-backend'
        resource-group-name: 'michaelb'
        package: './publish' 